        '<b>' + esc(fmtDate(r.t)) + (r.i ? ' · 中断' : '') + '</b>' +
        '<div class="row"><span>未命中</span><span>' + fmtTok(r.miss) + ' · ' + share(r.miss, tot) + '</span></div>' +
        '<div class="row"><span>缓存命中</span><span>' + fmtTok(r.read) + ' · ' + share(r.read, tot) + '</span></div>' +
        '<div class="row"><span>缓存写入</span><span>' + fmtTok(r.write) + ' · ' + share(r.write, tot) + '</span></div>' +
        '<div class="row"><span>输出</span><span>' + fmtTok(r.out) + ' · ' + share(r.out, tot) + '</span></div>' +
        '<div class="row"><span>累计输入</span><span>' + fmtTok(r.cum) + '</span></div>');
    };
    cv.onmouseleave = function () { hoverIdx = -1; frame(); hideTip(); };
  }

  /* ================= 筛选 sheet ================= */
  function fCount() {
    var n = 0;
    if (state.models.length) n++;
    if (state.session) n++;
    if (state.wd) n++;
    if (state.range === 'custom') n++;
    return n;
  }
  function openSheet() {
    var html =
      '<div class="overlay" role="presentation">' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t">' +
      '<div class="grabber" aria-hidden="true"></div>' +
      '<div class="tt" id="sheet-t">筛选</div>' +
      '<div class="tt-sub">筛选将写入链接,可分享;作用于所有页面</div>' +
      '<div class="slist">' +
      '<div class="srow2"><span class="l">会话前缀</span><span class="c"><input class="inp" id="sh-session" placeholder="会话 ID 前缀…" value="' + esc(state.session) + '" style="width:200px"></span></div>' +
      '<div class="srow2"><span class="l">工作目录</span><span class="c"><input class="inp" id="sh-wd" placeholder="路径前缀…" value="' + esc(state.wd) + '" style="width:200px"></span></div>' +
      '<div class="srow2" style="display:block;border-bottom:0"><span class="l">模型</span>' +
      '<div class="maxh" style="margin-top:8px" id="sh-models"></div></div>' +
      '</div>' +
      '<div class="foot">' +
      '<button class="btn sm ghost" id="sh-clear">清除全部</button>' +
      '<button class="btn sm primary" id="sh-apply">应用</button></div>' +
      '</div></div>';
    $('sheet-root').innerHTML = html;
    sheetOpen = true;
    var list = $('sh-models');
    var models = (state.meta && state.meta.models) || [];
    list.innerHTML = models.length ? models.map(function (mk, i) {
      var on = state.models.indexOf(mk) >= 0;
      return '<label class="chk"><input type="checkbox" value="' + esc(mk) + '"' + (on ? ' checked' : '') + '><i class="dot" style="background:' + catColor(i) + '"></i><span>' + esc(mk) + '</span></label>';
    }).join('') : '<div class="muted" style="padding:6px;font-size:12px">暂无模型</div>';
    $('sh-apply').onclick = function () {
      state.session = $('sh-session').value.trim();
      state.wd = $('sh-wd').value.trim();
      state.models = Array.prototype.slice.call(list.querySelectorAll('input')).filter(function (c) { return c.checked; }).map(function (c) { return c.value; });
      closeSheet();
      applyUI();
      loadTab('activity');
      loadTab('today', true);
      toast('筛选已应用');
    };
    $('sh-clear').onclick = function () {
      state.session = ''; state.wd = ''; state.models = [];
      closeSheet();
      applyUI();
      loadTab('activity');
      loadTab('today', true);
      toast('已清除全部筛选');
    };
    document.querySelectorAll('.overlay').forEach(function (bg) {
      bg.onclick = function (e) { if (e.target === bg) closeSheet(); };
    });
    document.addEventListener('keydown', onSheetKey);
  }
  function onSheetKey(e) {
    if (!sheetOpen) return;
    if (e.key === 'Escape') { e.preventDefault(); closeSheet(); }
  }
  function closeSheet() {
    sheetOpen = false;
    document.removeEventListener('keydown', onSheetKey);
    $('sheet-root').innerHTML = '';
    hideTip();
  }

  /* ================= UI 同步 / 导航 ================= */
  var scrollPos = {};
  function setTab(tab, force) {
    /* 详情页盖在内容上:切 Tab 先把它推回去,否则"切了但看不见" */
    if (state.pushed) closeDetail();
    if (!force && state.tab === tab) return;
    scrollPos[state.tab] = window.scrollY;
    state.tab = tab;
    document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('on'); });
    var pg = $('page-' + tab);
    if (pg) pg.classList.add('on');
    document.querySelectorAll('.tb').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-tab') === tab);
    });
    window.scrollTo({ top: scrollPos[tab] || 0, behavior: 'auto' });
    escUrl();
    loadTab(tab);
    hideTip();
  }
  function applyUI() {
    setSeg('f-range', 'data-r', state.range);
    document.querySelectorAll('[data-act="fdot"]').forEach(function (d) {
      d.classList.toggle('hide', fCount() === 0);
    });
    escUrl();
  }
  function syncNavChrome() {
    /* 主题图标 */
    document.querySelectorAll('[data-act="theme"]').forEach(function (btn) {
      btn.querySelector('.ic-auto').classList.toggle('hide', state.theme !== 'auto');
      btn.querySelector('.ic-sun').classList.toggle('hide', state.theme !== 'light');
      btn.querySelector('.ic-moon').classList.toggle('hide', state.theme !== 'dark');
    });
  }
  function bindSegs(root) {
    root.querySelectorAll('#m-seg button').forEach(function (b) {
      b.onclick = function () {
        state.metric = b.getAttribute('data-m');
        setSeg('m-seg', 'data-m', state.metric);
        loadTab('activity');
      };
    });
    root.querySelectorAll('#g-seg button').forEach(function (b) {
      b.onclick = function () {
        state.granularity = b.getAttribute('data-g');
        setSeg('g-seg', 'data-g', state.granularity);
        loadTab('activity');
      };
    });
    root.querySelectorAll('#hour-seg button').forEach(function (b) {
      b.onclick = function () {
        state.hourMetric = b.getAttribute('data-h');
        setSeg('hour-seg', 'data-h', state.hourMetric);
        drawHours('hours', state._hours, 120, 'hour-note', false);
      };
    });
    root.querySelectorAll('#hm-seg button').forEach(function (b) {
      b.onclick = function () {
        state.hmMode = b.getAttribute('data-h');
        setSeg('hm-seg', 'data-h', state.hmMode);
        renderHeatmap(state._heat);
      };
    });
  }

  /* ================= 数据加载(按 tab) ================= */
  function loadTab(tab, force) {
    if (tab === 'today') {
      var tf = fParams('today');
      return Promise.all([
        get('/kpi', tf).then(function (k) { state.today = k; }),
        get('/hours', tf).then(function (b) { state.hoursToday = b; }),
        get('/sessions', Object.assign({ sort: 'recent', limit: 4 }, tf)).then(function (l) { state.sessToday = l; })
      ]).then(function () { renderToday(); }).catch(function (e) { toast('加载失败:' + e.message); });
    }
    if (tab === 'activity') {
      var f = fParams();
      return Promise.all([
        get('/kpi', f).then(function (k) { state.kpiAct = k; }),
        get('/series', Object.assign({ granularity: state.granularity }, f)).then(function (s) { state._series = s; }),
        get('/hours', f).then(function (b) { state._hours = b; }),
        get('/heatmap', Object.assign({ months: 12 }, f)).then(function (d) { state._heat = d; }),
        get('/kpi', Object.assign({ range: 'all' }, f)).then(function (k) { state.kpiAll = k; }),
        get('/sessions', Object.assign({ sort: 'cost', limit: 6 }, f)).then(function (l) { state.costTop = l; })
      ]).then(function () { renderActivity(); }).catch(function (e) { toast('加载失败:' + e.message); });
    }
    if (tab === 'sessions') {
      return get('/sessions', Object.assign({ sort: state.sSort, limit: 100, q: state.search.trim() }, fParams()))
        .then(function (list) { state.sessionsList = list; renderSessions(); })
        .catch(function (e) { toast('加载失败:' + e.message); });
    }
    if (tab === 'settings') {
      // 这次 KPI **刻意不带当前筛选**:月度预算是整月总账,不该因为筛了某个模型
      // 就只统计那个模型(原先带 fParams 会,属 bug)。
      return Promise.all([
        get('/meta').then(function (m) { state.meta = m; }),
        get('/config').then(function (c) { state.config = c; }),
        get('/kpi', { range: 'month' }).then(function (k) { state.kpiMonth = k; })
      ]).then(function () { renderSettings(); }).catch(function (e) { toast('加载失败:' + e.message); });
    }
    return Promise.resolve();
  }

  /* ================= 主题 ================= */
  /* 「自动」= 跟随 **DSH 外观**,不是只跟随操作系统。
     DSH 把「浅色/深色/跟随系统」存在 ui-theme 设置段里(外壳读的也是它),本页是独立文档、
     看不到宿主的 DOM 属性,所以由宿主在发送时注入 window.__DSH_TOKEN_THEME__(见 lib/index.js)。
     注入缺失时(例如直接以文件打开本页)退回"只跟随系统",与从前一致。 */
  function dshThemePreference() {
    var t = window.__DSH_TOKEN_THEME__;
    if (!t) return null;
    var p = t.preference;
    return p === 'light' || p === 'dark' || p === 'system' ? p : null;
  }
  function osPrefersDark() {
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  /* DSH 把外观钉成浅色/深色时,系统深浅与本页无关;只有 DSH 是"跟随系统"(或没有注入)才看 OS。 */
  function autoTracksOs() {
    var p = dshThemePreference();
    return p !== 'light' && p !== 'dark';
  }
  function autoPrefersDark() {
    var p = dshThemePreference();
    if (p === 'dark') return true;
    if (p === 'light') return false;
    return osPrefersDark();
  }
  function themeToastText() {
    if (state.theme === 'light') return '主题:浅色';
    if (state.theme === 'dark') return '主题:深色';
    var p = dshThemePreference();
    if (p === 'light') return '主题:跟随 DSH(浅色)';
    if (p === 'dark') return '主题:跟随 DSH(深色)';
    return p === 'system' ? '主题:跟随 DSH(跟随系统)' : '主题:跟随系统';
  }
  function applyTheme(animate, x, y) {
    var dark = state.theme === 'dark' || (state.theme === 'auto' && autoPrefersDark());
    var swap = function () {
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      syncNavChrome();
      if (state._series && state.tab === 'activity') renderTrend(state._series, state.kpiAct);
      if (state.hoursToday && state.tab === 'today') drawHours('today-hours', state.hoursToday, 110, null, true);
      if (state._hours && state.tab === 'activity') drawHours('hours', state._hours, 120, 'hour-note', false);
      if (state._heat && state.tab === 'activity') renderHeatmap(state._heat);
      if (state.today && state.tab === 'today') renderToday();
    };
    /* 主题转场是用户点名要的效果,不受系统"减少动态"开关影响;仅首次加载直切 */
    if (!animate) { swap(); return; }
    var root = document.documentElement;
    if (x != null) {
      root.style.setProperty('--bloom-x', Math.round(x) + 'px');
      root.style.setProperty('--bloom-y', Math.round(y) + 'px');
    }
    if (document.startViewTransition) {
      document.startViewTransition(swap);
    } else {
      root.classList.add('theming');
      swap();
      setTimeout(function () { root.classList.remove('theming'); }, 520);
    }
  }

  /* ================= 事件绑定 ================= */
  function bindChrome() {
    /* Tab 栏 */
    document.querySelectorAll('.tb').forEach(function (b) {
      b.onclick = function () { setTab(b.getAttribute('data-tab')); };
    });
    /* 每页导航动作 */
    document.querySelectorAll('.navbar [data-act]').forEach(function (el) {
      var act = el.getAttribute('data-act');
      if (act === 'filters' || el.closest('[data-act="filters"]') === el) {
        el.onclick = function () { openSheet(); };
      } else if (act === 'theme') {
        el.onclick = function (e) {
          state.theme = state.theme === 'auto' ? 'light' : state.theme === 'light' ? 'dark' : 'auto';
          localStorage.setItem('dsh-token-theme', state.theme === 'auto' ? '' : state.theme);
          applyTheme(true, e.clientX, e.clientY);
          toast(themeToastText());
        };
      } else if (act === 'refresh') {
        el.onclick = function () { loadTab('activity', true); toast('已刷新'); };
      } else if (act === 'share') {
        el.onclick = function () {
          escUrl();
          var url = location.href;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(function () { toast('已复制分享链接'); }, function () { prompt('复制链接', url); });
          } else prompt('复制链接', url);
        };
      }
    });
    /* 范围分段 */
    document.querySelectorAll('#f-range button').forEach(function (b) {
      b.onclick = function () {
        state.range = b.getAttribute('data-r');
        if (state.range !== 'custom') { state.from = ''; state.to = ''; }
        applyUI();
        loadTab('activity');
      };
    });
    /* 会话搜索(250ms 防抖后走服务端 q 过滤)/排序 */
    var sessSearchTimer = null;
    $('sess-search').oninput = function () {
      state.search = this.value;
      $('sess-clr').classList.toggle('hide', !this.value);
      if (sessSearchTimer) clearTimeout(sessSearchTimer);
      sessSearchTimer = setTimeout(function () { loadTab('sessions'); }, 250);
    };
    $('sess-clr').onclick = function () {
      state.search = '';
      $('sess-search').value = '';
      this.classList.add('hide');
      loadTab('sessions');
    };
    document.querySelectorAll('#s-seg button').forEach(function (b) {
      b.onclick = function () {
        state.sSort = b.getAttribute('data-s');
        setSeg('s-seg', 'data-s', state.sSort);
        loadTab('sessions');
      };
    });
    /* 详情返回 */
    $('detail-back').onclick = closeDetail;
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        if (sheetOpen) closeSheet();
        else if (state.pushed) closeDetail();
      }
    });
    /* 折叠大标题 */
    var updateScrolled = function () {
      var y = window.scrollY || 0;
      document.querySelectorAll('.navbar').forEach(function (n) {
        var page = n.closest('.page') || n.closest('.pushpage');
        var visible = page && page.classList.contains('on');
        var sy = page && page.classList.contains('pushpage') ? page.scrollTop : y;
        n.classList.toggle('scrolled', visible && sy > 26);
      });
    };
    window.addEventListener('scroll', updateScrolled, { passive: true });
    $('page-detail').addEventListener('scroll', updateScrolled, { passive: true });
    window.addEventListener('resize', function () {
      segSyncAll();
      clearTimeout(window.__rsz);
      window.__rsz = setTimeout(function () {
        if (state.tab === 'today') renderToday();
        else if (state.tab === 'activity') renderActivity();
      }, 200);
    });
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
        /* DSH 把外观钉成浅色/深色时,系统深浅不影响本页,不必重绘 */
        if (state.theme === 'auto' && autoTracksOs()) applyTheme(true);
      });
    }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { segSyncAll(); });
  }

  /* ================= 启动 ================= */
  function boot() {
    applyTheme();
    var q = new URLSearchParams(location.search);
    if (q.get('tab')) state.tab = q.get('tab');
    if (q.get('range')) state.range = q.get('range');
    if (q.get('from')) state.from = q.get('from');
    if (q.get('to')) state.to = q.get('to');
    if (q.get('session')) state.session = q.get('session');
    if (q.get('wd')) state.wd = q.get('wd');
    if (q.get('models')) state.models = q.get('models').split(',').filter(Boolean);
    var sid = q.get('session');

    get('/meta').then(function (m) {
      state.meta = m;
      bindChrome();
      applyUI();
      var startTab = state.tab;
      if (sid) startTab = 'sessions';
      else if (state.range !== 'all' || state.models.length || state.wd || state.session) startTab = 'activity';
      if (['today', 'activity', 'sessions', 'settings'].indexOf(startTab) < 0) startTab = 'today';
      document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('on'); });
      $('page-' + startTab).classList.add('on');
      document.querySelectorAll('.tb').forEach(function (b) {
        b.classList.toggle('on', b.getAttribute('data-tab') === startTab);
      });
      state.tab = startTab;
      loadTab(startTab);
      if (sid) setTimeout(function () { openDetail(sid); }, 420);
      setInterval(function () {
        if (!document.hidden && !state.pushed && !sheetOpen) loadTab(state.tab);
      }, 60000);
    }).catch(function (e) {
      $('today-body').innerHTML = '<div class="card">' + emptyHTML('无法连接数据 API', e.message + ' — 请通过 dsh-token 插件页面访问') + '</div>';
    });
  }
  boot();
})();
</script>
</body>
