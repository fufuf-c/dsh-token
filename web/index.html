  var REFRESH_DEFAULTS = { pageSec: 60, scanSec: 300, onOpen: true };

  function refreshSettings() {
    var src = (state.meta && state.meta.refresh) || (state.config && state.config.refresh) || {};
    var pick = function (k) {
      var v = src[k];
      var n = Number(v);
      if (v === null || v === undefined || v === '' || !isFinite(n) || n < 0) return REFRESH_DEFAULTS[k];
      return n === 0 ? 0 : Math.round(n);
    };
    return {
      pageSec: pick('pageSec'),
      scanSec: pick('scanSec'),
      onOpen: src.onOpen === undefined || src.onOpen === null ? REFRESH_DEFAULTS.onOpen : !!src.onOpen
    };
  }

  function refreshOnOpen() { return refreshSettings().onOpen; }

  var autoRefreshTimer = null;
  function startAutoRefresh() {
    if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
    var sec = refreshSettings().pageSec;
    if (!(sec > 0)) return;
    autoRefreshTimer = setInterval(function () {
      
      
      
      if (document.hidden || state.pushed || sheetOpen) return;
      if (state.tab === 'settings') return;
      if (document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
      loadTab(state.tab);
    }, sec * 1000);
  }

  var scanInFlight = null;

  function scanThenReload(tab) {
    if (!scanInFlight) {
      
      scanInFlight = post('/scan', {}).then(
        function (r) { return { ok: true, summary: r && r.summary }; },
        function (e) { return { ok: false, error: (e && e.message) || String(e) }; }
      ).then(function (res) {
        scanInFlight = null;
        return res;
      });
    }
    var target = tab || state.tab;
    return scanInFlight.then(function (res) {
      return loadTab(target).then(function () { return res; });
    });
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    if (!refreshOnOpen()) return;
    if (state.pushed || sheetOpen) return;
    if (state.tab === 'settings') return;
    scanThenReload(state.tab);
  });
  function dshThemePreference() {
    var t = window.__DSH_TOKEN_THEME__;
    if (!t) return null;
    var p = t.preference;
    return p === 'light' || p === 'dark' || p === 'system' ? p : null;
  }
  function osPrefersDark() {
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }

  function autoTracksOs() {
    var p = dshThemePreference();
    return p !== 'light' && p !== 'dark';
  }
  function autoPrefersDark() {
    var p = dshThemePreference();
    if (p === 'dark') return true;
    if (p === 'light') return false;
    return osPrefersDark();
  }
  function themeToastText() {
    if (state.theme === 'light') return '主题:浅色';
    if (state.theme === 'dark') return '主题:深色';
    var p = dshThemePreference();
    if (p === 'light') return '主题:跟随 DSH(浅色)';
    if (p === 'dark') return '主题:跟随 DSH(深色)';
    return p === 'system' ? '主题:跟随 DSH(跟随系统)' : '主题:跟随系统';
  }
  function applyTheme(animate, x, y) {
    var dark = state.theme === 'dark' || (state.theme === 'auto' && autoPrefersDark());
    var swap = function () {
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      syncNavChrome();
      if (state._series && state.tab === 'activity') renderTrend(state._series);
      if (state.hoursToday && state.tab === 'today') drawHours('today-hours', state.hoursToday, 110, null, true);
      if (state._hours && state.tab === 'activity') drawHours('hours', state._hours, 120, 'hour-note', false);
      if (state._heat && state.tab === 'activity') renderHeatmap(state._heat);
      if (state.today && state.tab === 'today') renderToday();
    };

    if (!animate) { swap(); return; }
    var root = document.documentElement;
    if (x != null) {
      root.style.setProperty('--rip-x', Math.round(x) + 'px');
      root.style.setProperty('--rip-y', Math.round(y) + 'px');
    }

    var ripple = document.createElement('div');
    ripple.className = 'theme-ripple';

    root.classList.add('theming');
    void root.offsetWidth;
    swap();
    document.body.appendChild(ripple);
    setTimeout(function () { root.classList.remove('theming'); }, 620);
    setTimeout(function () { if (ripple.parentNode) ripple.parentNode.removeChild(ripple); }, 760);
  }
  function bindChrome() {

    document.querySelectorAll('.tb').forEach(function (b) {
      b.onclick = function () { setTab(b.getAttribute('data-tab')); };
    });

    document.querySelectorAll('.navbar [data-act]').forEach(function (el) {
      var act = el.getAttribute('data-act');
      if (act === 'filters' || el.closest('[data-act="filters"]') === el) {
        el.onclick = function () { openSheet(); };
      } else if (act === 'theme') {
        el.onclick = function (e) {
          state.theme = state.theme === 'auto' ? 'light' : state.theme === 'light' ? 'dark' : 'auto';
          localStorage.setItem('dsh-token-theme', state.theme === 'auto' ? '' : state.theme);
          applyTheme(true, e.clientX, e.clientY);
          toast(themeToastText());
        };
      } else if (act === 'refresh') {
        
        
        
        
        
        
        
        
        
        
        
        el.onclick = function () {
          var btn = el;
          btn.disabled = true;
          
          
          
          scanThenReload(state.tab).then(function (res) {
            btn.disabled = false;
            if (res && res.ok === false) toast('已重取数据,但扫描失败:' + res.error);
            else toast('已刷新');
          }, function () {
            btn.disabled = false;
            toast('刷新失败');
          });
        };
      } else if (act === 'share') {
        el.onclick = function () {
          escUrl();
          var url = location.href;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(function () { toast('已复制分享链接'); }, function () { prompt('复制链接', url); });
          } else prompt('复制链接', url);
        };
      }
    });

    document.querySelectorAll('#f-range button').forEach(function (b) {
      b.onclick = function () {
        state.range = b.getAttribute('data-r');
        state.from = ''; state.to = '';
        state.rpOpen = false;   
        applyUI();
        loadTab('activity');
      };
    });

    var sessSearchTimer = null;
    $('sess-search').oninput = function () {
      state.search = this.value;
      $('sess-clr').classList.toggle('hide', !this.value);
      if (sessSearchTimer) clearTimeout(sessSearchTimer);
      sessSearchTimer = setTimeout(function () { loadTab('sessions'); }, 250);
    };
    $('sess-clr').onclick = function () {
      state.search = '';
      $('sess-search').value = '';
      this.classList.add('hide');
      loadTab('sessions');
    };
    document.querySelectorAll('#s-seg button').forEach(function (b) {
      b.onclick = function () {
        state.sSort = b.getAttribute('data-s');
        setSeg('s-seg', 'data-s', state.sSort);
        loadTab('sessions');
      };
    });

    $('detail-back').onclick = closeDetail;
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        if (sheetOpen) closeSheet();
        else if (state.pushed) closeDetail();
      }
    });

    var updateScrolled = function () {
      var y = window.scrollY || 0;
      document.querySelectorAll('.navbar').forEach(function (n) {
        var page = n.closest('.page') || n.closest('.pushpage');
        var visible = page && page.classList.contains('on');
        var sy = page && page.classList.contains('pushpage') ? page.scrollTop : y;
        n.classList.toggle('scrolled', visible && sy > 26);
      });
    };
    window.addEventListener('scroll', updateScrolled, { passive: true });
    $('page-detail').addEventListener('scroll', updateScrolled, { passive: true });
    
    window.addEventListener('popstate', function () {
      var q = new URLSearchParams(location.search);
      var want = q.get('detail');
      if (want && !state.pushed) openDetail(want, { replace: true });
      else if (!want && state.pushed) { closeDetail(); escUrl(); }
    });
    
    setDetailInert(true);
    window.addEventListener('resize', function () {
      segSyncAll();
      clearTimeout(window.__rsz);
      window.__rsz = setTimeout(function () {
        
        
        
        if (state.pushed && state.detail) { renderDetail(state.detail); return; }
        if (state.tab === 'today') renderToday();
        else if (state.tab === 'activity') renderActivity();
        else if (state.tab === 'sessions') renderSessions();
      }, 200);
    });
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {

        if (state.theme === 'auto' && autoTracksOs()) applyTheme(true);
      });
    }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { segSyncAll(); });
  }
  function boot() {
    applyTheme();
    
    
    
    bindChrome();
    var q = new URLSearchParams(location.search);
    if (q.get('tab')) state.tab = q.get('tab');
    if (q.get('range')) state.range = q.get('range');
    if (q.get('from')) state.from = q.get('from');
    if (q.get('to')) state.to = q.get('to');
    if (q.get('session')) state.session = q.get('session');
    if (q.get('wd')) state.wd = q.get('wd');
    if (q.get('models')) state.models = q.get('models').split(',').filter(Boolean);
    
    if (q.get('q')) state.search = q.get('q');
    if (q.get('sort')) state.sSort = q.get('sort');
    
    
    
    
    
    var sid = q.get('detail');
    if (!sid && q.get('session') && !q.get('range') && !q.get('models') && !q.get('wd')) {
      var raw = q.get('session');
      if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(raw)) sid = raw;
    }

    get('/meta').then(function (m) {
      state.meta = m;
      
      
      try { localStorage.setItem('dsh-token-refresh-onopen', refreshSettings().onOpen ? '1' : '0'); } catch (e) {  }
      
      
      
      
      rebuildModelColors();
      applyUI();
      var startTab = state.tab;
      if (sid) startTab = 'sessions';
      else if (state.range !== 'all' || state.models.length || state.wd || state.session) startTab = 'activity';
      
      
      var explicit = q.get('tab');
      if (explicit && ['today', 'activity', 'sessions', 'settings'].indexOf(explicit) >= 0) startTab = explicit;
      if (['today', 'activity', 'sessions', 'settings'].indexOf(startTab) < 0) startTab = 'today';
      document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('on'); });
      $('page-' + startTab).classList.add('on');
      document.querySelectorAll('.tb').forEach(function (b) {
        b.classList.toggle('on', b.getAttribute('data-tab') === startTab);
        b.setAttribute('aria-current', b.getAttribute('data-tab') === startTab ? 'page' : 'false');
      });
      state.tab = startTab;

      if (refreshOnOpen()) void scanThenReload(startTab); else loadTab(startTab);
      if (sid) setTimeout(function () { openDetail(sid); }, 420);
      startAutoRefresh();
    }).catch(function (e) {
      
      var msg = (e && e.message) ? e.message : String(e);
      var card = '<div class="card">' + emptyHTML('无法连接数据 API', msg + ' — 请通过 dsh-token 插件页面访问') +
        '<div style="padding:0 0 4px"><button class="btn sm primary" id="boot-retry">重试</button></div></div>';
      document.querySelectorAll('.page .pagebody').forEach(function (el) { el.innerHTML = card; });
      var rb = $('boot-retry');
      if (rb) rb.onclick = function () { boot(); };
      toast('数据 API 不可达:' + msg);
    });
  }
  boot();
})();
</script>
</body>
</html>
