<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>用量 · Token</title>
<style>
/* ================================================================
   Token 用量 · 按 iOS App 组织的四标签页重设计(完全重构,非换肤)
   依据:Apple HIG Tab bars(Liquid Glass 悬浮标签栏)、
        屏幕使用时间(堆叠柱 + 类别下钻)、健身 app(摘要环 + 三联值)。
   数据层与 /dsh-token/api/* 契约不变。
   ================================================================ */
:root{
/* dtk:tokens:begin */
  --bg:#f2f2f7;
  --bg-grad:radial-gradient(110% 50% at 50% -8%,rgba(10,132,255,.09),transparent 60%),radial-gradient(60% 40% at 88% 0%,rgba(191,90,242,.05),transparent 65%);
  --glass-border:rgba(255,255,255,.5);
  --specular:inset 0 1px 0 rgba(255,255,255,.75);
  --surface-2:rgba(120,120,128,.08);
  --chip:rgba(120,120,128,.10);
  --text:#1d1d1f;
  --text-2:#6e6e73;
  --text-3:#aeaeb2;
  --hairline:rgba(0,0,0,.14);
  --hairline-2:rgba(0,0,0,.07);
  --accent:#007aff;
  --accent-soft:rgba(0,122,255,.13);
  --red:#ff3b30;
  --green:#34c759;
  --blue:#007aff;
  --orange:#ff9500;
  --teal:#5ac8fa;
  --purple:#af52de;
  --indigo:#5856d6;
  --gray:#8e8e93;
  --shadow:0 1px 1px rgba(0,0,0,.03),0 2px 10px rgba(0,0,0,.05),0 14px 36px rgba(0,0,0,.07);
  --shadow-float:0 8px 40px rgba(0,0,0,.18);
  --aurora:linear-gradient(100deg,#0a84ff 0%,#5e5ce6 24%,#bf5af2 48%,#ff375f 72%,#ff9f0a 100%);
  --glass:linear-gradient(180deg,rgba(255,255,255,.80),rgba(255,255,255,.56));
  --glass-strong:rgba(255,255,255,.82);
  --seg-track:rgba(120,120,128,.10);
  --seg-on:#ffffff;
  --seg-shadow:0 1px 4px rgba(0,0,0,.12),0 0 1px rgba(0,0,0,.08);
  --tabbar:rgba(255,255,255,.66);
  --tip-bg:rgba(30,30,32,.88);
  --tip-text:#f5f5f7;
/* dtk:tokens:end */
}
[data-theme=dark]{
/* dtk:tokens:begin */
  --bg:#000;
  --bg-grad:radial-gradient(110% 50% at 50% -8%,rgba(94,92,230,.15),transparent 60%),radial-gradient(60% 40% at 88% 0%,rgba(191,90,242,.07),transparent 65%);
  --glass-border:rgba(255,255,255,.09);
  --specular:inset 0 1px 0 rgba(255,255,255,.08);
  --surface-2:rgba(120,120,128,.16);
  --chip:rgba(120,120,128,.2);
  --text:#f5f5f7;
  --text-2:#98989d;
  --text-3:#6e6e73;
  --hairline:rgba(255,255,255,.16);
  --hairline-2:rgba(255,255,255,.09);
  --accent:#0a84ff;
  --accent-soft:rgba(10,132,255,.22);
  --red:#ff453a;
  --green:#30d158;
  --blue:#0a84ff;
  --orange:#ff9f0a;
  --teal:#64d2ff;
  --purple:#bf5af2;
  --indigo:#7d7aff;
  --gray:#98989d;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 30px rgba(0,0,0,.35);
  --shadow-float:0 8px 40px rgba(0,0,0,.6);
  --aurora:linear-gradient(100deg,#0a84ff 0%,#7d7aff 24%,#bf5af2 48%,#ff375f 72%,#ff9f0a 100%);
  --glass:linear-gradient(180deg,rgba(42,42,47,.6),rgba(26,26,30,.48));
  --glass-strong:rgba(44,44,46,.76);
  --seg-track:rgba(120,120,128,.18);
  --seg-on:#636366;
  --seg-shadow:none;
  --tabbar:rgba(22,22,26,.56);
  --tip-bg:rgba(44,44,46,.92);
  --tip-text:#f5f5f7;
/* dtk:tokens:end */
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg-grad), var(--bg);background-attachment:fixed;color:var(--text);font-family:var(--dsw-font-family,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif);font-size:15px;line-height:1.47;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
::selection{background:var(--accent-soft)}
h1,h2,h3{font-weight:700;letter-spacing:-.02em;margin:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;word-break:break-all}
.muted{color:var(--text-2)}
.hide{display:none!important}

/* ============ 页面骨架:四个 Tab 页 + push 详情页 + 悬浮标签栏 ============ */
.page{display:none;min-height:100vh;padding-bottom:120px}
.page.on{display:block}
.pagebody{max-width:680px;margin:0 auto;padding:6px 18px 0;display:flex;flex-direction:column;gap:14px}
.pushpage{position:fixed;inset:0;z-index:60;background:var(--bg-grad), var(--bg);overflow-y:auto;transform:translateX(103%);transition:transform .4s cubic-bezier(.32,.72,0,1);padding-bottom:120px}
.pushpage.on{transform:none}

/* ============ 每页自己的大标题导航(滚动折叠) ============ */
.navbar{position:sticky;top:0;z-index:50;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:52px;padding:8px max(14px,calc((100% - 680px) / 2 + 18px));background:transparent;border-bottom:1px solid transparent;transition:background .28s ease-out,border-color .28s ease-out}
.navbar.scrolled{background:var(--tabbar);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border-bottom-color:var(--hairline-2)}
.navbar .ntitle{grid-column:2;font-size:17px;font-weight:650;letter-spacing:-.01em;opacity:0;transform:translateY(5px) scale(.94);transition:opacity .22s ease-out,transform .22s ease-out;white-space:nowrap}
.navbar.scrolled .ntitle{opacity:1;transform:none}
.navbar .nacts{grid-column:3;justify-self:end;display:flex;gap:2px}
.navbar .nback{grid-column:1;justify-self:start;display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-size:16.5px;padding:6px 8px 6px 0;border-radius:10px;transition:opacity .18s ease-out}
.navbar .nback:active{opacity:.5}
.navbar .nback svg{width:15px;height:15px}
.ibtn{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);transition:background .18s ease-out,transform .14s ease-out;position:relative}
.ibtn:hover{background:var(--accent-soft)}
.ibtn:active{transform:scale(.9)}
.ibtn svg{width:18px;height:18px}
.ibtn .dot{position:absolute;top:4px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
.ibtn .dot.hide{display:none}
.pagehead{max-width:680px;margin:0 auto;padding:8px 18px 0}
.pagehead .eyebrow{font-size:13px;color:var(--text-2);font-weight:500}
.pagehead h1{font-size:34px;line-height:1.12;letter-spacing:-.024em;margin-top:1px}
.pagehead h1 .grad{background:var(--aurora);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}

/* ============ Liquid Glass 卡片 ============ */
.card{background:var(--glass);backdrop-filter:blur(48px) saturate(200%);-webkit-backdrop-filter:blur(48px) saturate(200%);border:1px solid var(--glass-border);border-radius:26px;padding:20px;box-shadow:var(--shadow),var(--specular)}
.card.list{padding:5px 8px}
.card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-head h2{font-size:17px;letter-spacing:-.015em}
.card-head .grow{flex:1}
.card-note{font-size:11.5px;color:var(--text-2)}
.sechead{display:flex;align-items:baseline;gap:8px;margin:10px 2px 0}
.sechead h3{font-size:15px;letter-spacing:-.01em}
.sechead .lnk{margin-left:auto;font-size:13px;color:var(--accent);display:inline-flex;align-items:center;gap:1px}
.sechead .lnk svg{width:12px;height:12px}
.sechead .lnk:active{opacity:.5}

/* ============ 悬浮 Liquid Glass 标签栏 ============ */
.tabbar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;display:flex;gap:2px;padding:5px;border-radius:980px;background:var(--tabbar);backdrop-filter:blur(40px) saturate(200%);-webkit-backdrop-filter:blur(40px) saturate(200%);border:1px solid var(--glass-border);box-shadow:var(--shadow-float),var(--specular);animation:tabIn .5s cubic-bezier(.3,.9,.3,1.02)}
@keyframes tabIn{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%)}}
.tb{width:74px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:980px;color:var(--text-2);transition:color .18s ease-out,background .18s ease-out}
.tb svg{width:23px;height:23px}
.tb span{font-size:10px;font-weight:600;letter-spacing:.01em}
.tb.on{color:var(--accent);background:var(--chip)}
.tb:active{transform:scale(.94)}

/* ============ 分段控件(滑动 thumb) ============ */
.seg{position:relative;display:inline-flex;gap:2px;padding:2px;background:var(--seg-track);border-radius:980px;flex-wrap:wrap;max-width:100%}
.seg .seg-thumb{position:absolute;left:0;top:0;border-radius:980px;background:var(--seg-on);box-shadow:var(--seg-shadow);transition:transform .3s cubic-bezier(.3,.75,.25,1),width .3s cubic-bezier(.3,.75,.25,1);pointer-events:none}
.seg button{position:relative;height:32px;padding:0 14px;border-radius:980px;font-size:13px;font-weight:500;color:var(--text-2);white-space:nowrap;transition:color .18s ease-out}
.seg button:hover{color:var(--text)}
.seg button.on{color:var(--text);font-weight:600}
.seg.sm button{height:28px;padding:0 11px;font-size:12px}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:980px;font-size:12.5px;font-weight:500;color:var(--accent);white-space:nowrap;transition:background .18s ease-out,transform .14s ease-out}
.btn:hover{background:var(--accent-soft)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 1px 4px rgba(0,122,255,.3)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.sm{height:27px;padding:0 11px;font-size:11.5px}
.btn svg{width:14px;height:14px;flex:none}
.btn:disabled{opacity:.45;pointer-events:none}
.inp{height:34px;padding:0 12px;border-radius:11px;border:1px solid var(--hairline-2);background:var(--glass-strong);font-size:13px;color:var(--text);transition:border-color .18s ease-out,box-shadow .18s ease-out}
[data-theme=dark] .inp{border-color:transparent}
.inp::placeholder{color:var(--text-3)}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3.5px var(--accent-soft)}

/* ============ 今天:屏幕使用时间式 hero(大数字 + 当日小时柱) ============ */
.hero-top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hero-num{font-size:44px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05}
.hero-num .unit{font-size:15px;font-weight:600;color:var(--text-2);letter-spacing:0;margin-left:6px}
.hero-meta{font-size:13px;color:var(--text-2);margin-top:7px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.hero-meta .sep{color:var(--text-3)}
.hero-chart{margin-top:16px}
.segbar{display:flex;gap:2.5px;height:11px;border-radius:6px;overflow:hidden}
.segbar i{display:block;min-width:3px;border-radius:1px}
.seglegend{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:14px}
.sli{display:flex;align-items:flex-start;gap:9px;min-width:0}
.sli .dot{width:9px;height:9px;border-radius:3px;flex:none;margin-top:5px}
.sli b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.2}
.sli span{display:block;font-size:11px;color:var(--text-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.delta-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:980px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.delta-chip.up{background:rgba(52,199,89,.14);color:var(--green)}
.delta-chip.down{background:rgba(255,59,48,.13);color:var(--red)}

/* 亮点(健康式) */
.flow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{background:var(--glass);backdrop-filter:blur(48px) saturate(200%);-webkit-backdrop-filter:blur(48px) saturate(200%);border:1px solid var(--glass-border);border-radius:22px;padding:15px 17px;box-shadow:var(--shadow),var(--specular);min-width:0}
.mini .mk{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text-2);font-weight:600}
.mini .mk .ic{width:20px;height:20px;border-radius:6.5px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.mini .mk .ic svg{width:11px;height:11px}
.mini .mv{font-size:23px;font-weight:750;letter-spacing:-.025em;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ms{font-size:11px;color:var(--text-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ms .up{color:var(--green);font-weight:650}
.mini .ms .down{color:var(--red);font-weight:650}

/* ============ 图表卡 ============ */
.totstrip{display:flex;gap:0;flex-wrap:wrap}
.totstrip .tcell{flex:1;min-width:100px;padding:2px 12px}
.totstrip .tcell + .tcell{border-left:1px solid var(--hairline-2)}
.totstrip b{display:block;font-size:19px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.totstrip span{font-size:10.5px;color:var(--text-2);font-weight:500}
.chart-wrap{position:relative}
canvas.chart{width:100%;display:block}
.bigrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bigrow .val{font-size:30px;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.12}
.bigrow .delta{font-size:12.5px;font-weight:650;font-variant-numeric:tabular-nums}
.bigrow .delta.up{color:var(--green)}
.bigrow .delta.down{color:var(--red)}
.bigrow .sub{font-size:11px;color:var(--text-3)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.lg{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:980px;background:var(--chip);color:var(--text-2);font-size:11px;line-height:1;transition:opacity .18s ease-out,color .18s ease-out,transform .12s ease-out}
.lg:hover{color:var(--text)}
.lg:active{transform:scale(.95)}
.lg i{width:8px;height:8px;border-radius:50%;flex:none}
.lg.on{color:var(--text);font-weight:600;box-shadow:inset 0 0 0 1px var(--hairline)}
.lg.off{opacity:.38}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:980px;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:600}
.fchip .x{display:inline-flex;opacity:.7}
.fchip .x svg{width:10px;height:10px}
.fchip .x:hover{opacity:1}
.rangechip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:980px;background:var(--chip);color:var(--text-2);font-size:11.5px;font-weight:600}
.rangechip .x svg{width:10px;height:10px}
.rangechip .x:hover{color:var(--red)}

/* ============ 屏幕使用时间式类别列表(模型) ============ */
.catrow{position:relative;width:100%;display:flex;align-items:center;gap:11px;padding:12px 12px;text-align:left;border-radius:12px;transition:background .15s ease-out}
.catrow:hover{background:var(--surface-2)}
.catrow:not(:last-child)::after{content:'';position:absolute;left:35px;right:0;bottom:-1px;height:1px;background:var(--hairline-2)}
.catrow .cdot{width:11px;height:11px;border-radius:4px;flex:none}
.catrow .cmain{flex:1;min-width:0}
.catrow .cname{font-size:13.5px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .cbar{height:4.5px;border-radius:3px;background:var(--chip);margin-top:6px;overflow:hidden}
.catrow .cbar i{display:block;height:100%;border-radius:3px;min-width:3px}
.catrow .cval{text-align:right;flex:none}
.catrow .cval b{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;display:block}
.catrow .cval span{font-size:10.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.catrow.off{opacity:.42}
.catrow .tick{flex:none;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--text-3);transition:color .15s ease-out}
.catrow.sel .tick{color:var(--accent)}
.catrow .tick svg{width:13px;height:13px}

/* ============ 内嵌分组列表(会话) ============ */
.glist{display:flex;flex-direction:column;padding:2px 0}
.grow-row{position:relative;width:100%;display:flex;align-items:center;gap:12px;padding:12px 12px;border-radius:14px;text-align:left;transition:background .15s ease-out}
.grow-row:hover{background:var(--surface-2)}
.grow-row:active{background:var(--surface-2)}
.grow-row:not(:last-child)::after{content:'';position:absolute;left:46px;right:0;bottom:-1px;height:1px;background:var(--hairline-2)}
.grow-row .sdot{width:10px;height:10px;border-radius:50%;flex:none}
.grow-row .smain{flex:1;min-width:0}
.grow-row .sname{font-size:14.5px;font-weight:600;letter-spacing:-.01em;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow-row .smeta{font-size:11px;color:var(--text-2);display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow-row .sval{text-align:right;flex:none}
.grow-row .sval b{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;display:block;line-height:1.3}
.grow-row .sval span{font-size:11px;color:var(--text-2);font-variant-numeric:tabular-nums}
.grow-row .chev{color:var(--text-3);flex:none}
.grow-row .chev svg{width:13px;height:13px}
.firebadge{display:inline-flex;align-items:center;gap:3px;padding:2.5px 8px;border-radius:980px;font-size:10px;font-weight:600;background:rgba(255,59,48,.14);color:var(--red);white-space:nowrap;flex:none}
.firebadge svg{width:10px;height:10px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2.5px 9px;border-radius:980px;font-size:10.5px;font-weight:600;background:var(--chip);color:var(--text-2);white-space:nowrap}
.pill.hot{background:rgba(255,59,48,.14);color:var(--red)}

/* 搜索框(iOS) */
.search{display:flex;align-items:center;gap:7px;height:36px;padding:0 11px;border-radius:12px;background:var(--seg-track);color:var(--text-3)}
.search svg{width:15px;height:15px;flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:14px;color:var(--text)}
.search input:focus{outline:none}
.search .clr{display:inline-flex;color:var(--text-3);padding:2px}
.search .clr svg{width:13px;height:13px}

/* ============ 设置(分组行) ============ */
.group{overflow:hidden}
.gtitle{font-size:13px;font-weight:600;color:var(--text-2);margin:2px 6px 7px}
.setrow{position:relative;display:flex;align-items:center;gap:10px;padding:12px 12px;min-height:40px}
.setrow:not(:last-child)::after{content:'';position:absolute;left:12px;right:0;bottom:-1px;height:1px;background:var(--hairline-2)}
.setrow .sl{font-size:14px;flex:none}
.setrow .sv{margin-left:auto;text-align:right;font-size:13.5px;color:var(--text-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.setrow .sv.mono{font-size:11px;text-align:right}
.setrow .chev{color:var(--text-3);flex:none}
.setrow .chev svg{width:12px;height:12px}
.setrow .grow{flex:1}
.setrow.stack{flex-wrap:wrap}
.setrow.stack .sv{flex-basis:100%;white-space:normal;text-align:left;margin-left:0}
.seg-inline{margin-left:auto}
.prow{position:relative;display:flex;flex-direction:column;gap:8px;padding:12px 6px}
.prow:not(:last-child)::after{content:'';position:absolute;left:6px;right:0;bottom:-1px;height:1px;background:var(--hairline-2)}
.prow .phead{display:flex;align-items:center;gap:8px}
.prow .phead .pmodel{font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pgrid{display:grid;grid-template-columns:26px repeat(4,1fr);gap:8px}
.prow .ptag{align-self:end;padding-bottom:9px;font-size:9.5px;color:var(--text-3);font-weight:600;letter-spacing:.5px}
.pcell{display:flex;flex-direction:column;gap:3px;min-width:0}
.pcell em{font-style:normal;font-size:9.5px;color:var(--text-3);font-weight:500}
.pcell .inp{width:100%;height:30px;text-align:right;font-variant-numeric:tabular-nums;padding:0 8px;font-size:12px}
.budget-bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:7px}
.budget-bar i{display:block;height:100%;border-radius:3px}
.barrowbtn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--accent)}

/* ============ 高峰时段:点选式(沿用热力图单元格语言,不要求手输格式) ============ */
.setrow .fill{flex-basis:100%;min-width:0}
.sl em{font-style:normal;font-size:11.5px;color:var(--text-3);margin-left:5px}
.daychips{display:flex;gap:6px}
.daychips button{flex:1;min-width:0;height:34px;border-radius:11px;background:var(--chip);color:var(--text-2);font-size:12.5px;font-weight:600;transition:background .16s ease-out,color .16s ease-out,transform .14s ease-out}
.daychips button:hover{color:var(--text)}
.daychips button:active{transform:scale(.94)}
.daychips button.on{background:var(--accent);color:#fff;box-shadow:0 1px 4px rgba(0,122,255,.3)}
.hrgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.hrgrid button{height:28px;border-radius:8px;background:var(--chip);color:var(--text-3);font-size:9.5px;font-weight:600;font-variant-numeric:tabular-nums;transition:background .16s ease-out,color .16s ease-out,transform .14s ease-out}
.hrgrid button:hover{color:var(--text)}
.hrgrid button:active{transform:scale(.9)}
.hrgrid button.on{background:var(--accent);color:#fff;box-shadow:0 1px 4px rgba(0,122,255,.3)}
.peak-sum{font-size:12px;color:var(--text-2);line-height:1.65}
.peak-sum b{color:var(--text);font-weight:600}
.peak-presets{display:flex;gap:6px;margin-left:auto}
.peak-presets button{padding:6px 12px;border-radius:980px;background:var(--chip);color:var(--text-2);font-size:12px;font-weight:600;transition:background .16s ease-out,color .16s ease-out,transform .14s ease-out}
.peak-presets button:hover{background:var(--accent-soft);color:var(--accent)}
.peak-presets button:active{transform:scale(.95)}

/* ============ 热力图 ============ */
.heat-scroll{overflow-x:auto;padding-bottom:6px}
.hm-grid{display:grid;gap:3px;min-width:100%}
.hm-lbl{font-size:9.5px;color:var(--text-3);line-height:1;display:flex;align-items:center;justify-content:flex-end;white-space:nowrap}
.hm-cell{width:100%;height:100%;min-width:11px;min-height:16px;border-radius:4px;background:var(--chip);cursor:pointer;transition:transform .14s ease-out}
.hm-cell:hover{transform:scale(1.2)}
.hm-none{width:100%;height:100%;min-width:11px;min-height:16px}

/* ============ 弹层 / 提示 ============ */
.overlay{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .22s ease-out}
.sheet{background:var(--glass-strong);backdrop-filter:blur(36px) saturate(180%);-webkit-backdrop-filter:blur(36px) saturate(180%);border:1px solid var(--glass-border);border-bottom:0;border-radius:28px 28px 0 0;max-width:600px;width:100%;padding:8px 22px calc(24px + env(safe-area-inset-bottom));box-shadow:var(--shadow-float);animation:sheetUp .4s cubic-bezier(.32,.72,0,1);max-height:82vh;overflow-y:auto}
@keyframes sheetUp{from{transform:translateY(60%);opacity:.6}to{transform:none;opacity:1}}
.grabber{width:38px;height:5px;border-radius:3px;background:var(--hairline);margin:4px auto 14px;flex:none}
.sheet .tt{font-size:20px;font-weight:750;letter-spacing:-.02em}
.sheet .tt-sub{font-size:12px;color:var(--text-2);margin-top:3px}
.sheet .slist{margin-top:12px;display:flex;flex-direction:column}
.sheet .srow2{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--hairline-2);flex-wrap:wrap}
.sheet .srow2:last-child{border-bottom:0}
.sheet .srow2 .l{font-size:14px;min-width:88px}
.sheet .srow2 .c{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--hairline-2)}
.chk{display:flex;align-items:center;gap:9px;padding:8px;border-radius:10px;font-size:13px;cursor:pointer}
.chk:hover{background:var(--surface-2)}
.chk input{accent-color:var(--accent);width:17px;height:17px;flex:none}
.chk .dot{width:8px;height:8px;border-radius:50%;flex:none}
.chk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.maxh{max-height:250px;overflow-y:auto}
#tip{position:fixed;z-index:110;background:var(--tip-bg);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);color:var(--tip-text);font-size:11.5px;line-height:1.6;padding:9px 12px;border-radius:14px;pointer-events:none;max-width:360px;box-shadow:var(--shadow-float)}
#tip b{display:block;margin-bottom:3px;font-weight:650}
#tip .row{display:flex;justify-content:space-between;gap:14px}
#tip .row span:last-child{font-variant-numeric:tabular-nums;color:rgba(255,255,255,.72)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);z-index:120;background:var(--tip-bg);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);color:var(--tip-text);font-size:12.5px;padding:10px 18px;border-radius:980px;opacity:0;pointer-events:none;transition:opacity .22s ease-out,transform .22s ease-out;box-shadow:var(--shadow-float)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:38px 16px;text-align:center;color:var(--text-2)}
.empty svg{width:28px;height:28px;margin-bottom:10px;opacity:.35}
.empty b{display:block;font-size:14px;font-weight:650;color:var(--text);margin-bottom:3px}
.empty span{font-size:11.5px}
.skel{background:var(--chip);border-radius:20px;height:60px;margin:4px 0}
.foot-note{max-width:680px;margin:2px auto 0;padding:6px 18px 10px;text-align:center;font-size:11px;color:var(--text-3);display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap}
.foot-note svg{width:11px;height:11px}

/* ============ 详情页 ============ */
.meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 20px;margin:14px 0 16px}
.meta-grid b{display:block;font-size:10.5px;font-weight:600;color:var(--text-2);margin-bottom:2px;letter-spacing:.02em}
.meta-grid span{font-size:12.5px}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.stat{background:var(--surface-2);border-radius:16px;padding:12px 14px}
.stat .k{font-size:10.5px;color:var(--text-2);font-weight:600}
.stat .v{font-size:20px;font-weight:750;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.sec-title{font-size:15px;font-weight:700;margin:0 0 9px;letter-spacing:-.01em}
.rank{margin-bottom:12px}
.rank-line{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.rank-name{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.rank-name.mono{font-size:10.5px;color:var(--text-2)}
.rank-val{font-size:12.5px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.rank-pct{font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums;width:44px;text-align:right;white-space:nowrap}
.rank-bar{height:5px;border-radius:3px;background:var(--chip);overflow:hidden}
.rank-bar i{display:block;height:100%;border-radius:3px;min-width:3px}
table.req{width:100%;border-collapse:collapse;font-size:11.5px}
table.req th{color:var(--text-2);font-weight:600;font-size:10.5px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--hairline-2);white-space:nowrap;position:sticky;top:0;background:var(--glass-strong);backdrop-filter:blur(20px)}
table.req th.num,table.req td.num{text-align:right}
table.req td{padding:8px;border-bottom:1px solid var(--hairline-2);vertical-align:top}

@media (max-width:600px){
  .pagehead h1{font-size:29px}
  .flow{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}
  .meta-grid{grid-template-columns:repeat(2,1fr)}
  .stat4{grid-template-columns:repeat(2,1fr)}
  .tb{width:60px}
  .pagebody{padding:6px 13px 0}
  .pagehead{padding:8px 13px 0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
/* 主题切换过渡:新主题从点击处羽化晕开(View Transition + 径向渐变遮罩);不支持时降级为颜色过渡类 */
@property --vt-r{syntax:'<length>';inherits:false;initial-value:0px}
::view-transition-old(root){animation:none}
::view-transition-new(root){
  animation:bloom 1s cubic-bezier(.5,0,.12,1) both;
  -webkit-mask-image:radial-gradient(circle at var(--bloom-x,50%) var(--bloom-y,50%),#000 calc(var(--vt-r) - 18vmax),transparent var(--vt-r));
  mask-image:radial-gradient(circle at var(--bloom-x,50%) var(--bloom-y,50%),#000 calc(var(--vt-r) - 18vmax),transparent var(--vt-r));
}
@keyframes bloom{0%{--vt-r:0px}100%{--vt-r:210vmax}}
html.theming,html.theming *{transition:background-color .6s ease,color .6s ease,border-color .6s ease,box-shadow .6s ease,fill .6s ease,stroke .6s ease!important}
</style>

<script>
(function () {
  'use strict';
  if (window.__TOKEN_BOOT__) return;
  window.__TOKEN_BOOT__ = true;

  /* ================= 基础工具 ================= */
  var API = '/dsh-token/api';

  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });

  var fmtTok = function (n) {
    n = Number(n) || 0;
    if (n >= 1e9) return (n / 1e9).toFixed(2) + ' B';
    if (n >= 1e6) return (n / 1e6).toFixed(2) + ' M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + ' K';
    return String(Math.round(n));
  };
  var fmtCost = function (n) {
    n = Number(n) || 0;
    if (n >= 1000) return n.toFixed(0);
    if (n > 0 && n < 0.01) return n.toFixed(4);
    return n.toFixed(2);
  };
  var fmtPct = function (x) { return ((Number(x) || 0) * 100).toFixed(1) + '%'; };
  var pad2 = function (n) { return String(n).padStart(2, '0'); };
  var fmtDate = function (ms) {
    if (!ms) return '—';
    var d = new Date(ms);
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  };
  var dayKey = function (ms) {
    var d = new Date(ms);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  };
  var shortKey = function (k) {
    var p = String(k).split('-');
    if (p.length < 3) return k;
    return (+p[1]) + '/' + (+p[2]);
  };

      '<button data-g="week" class="' + (state.granularity === 'week' ? 'on' : '') + '">周</button>' +
      '<button data-g="month" class="' + (state.granularity === 'month' ? 'on' : '') + '">月</button></div></div>' +
      '<div class="bigrow" id="trend-hero"></div>' +
      '<div class="chart-wrap" id="trend-wrap"><canvas class="chart" id="trend-canvas" height="230" aria-label="用量图"></canvas></div>' +
      '<div class="legend" id="trend-legend"></div></section>';

    /* 模型类别(屏幕使用时间式) */
    html += '<div class="sechead"><h3>按模型 · 全部时间</h3><span class="card-note">轻点仅看该模型</span></div>';

      '<div class="seg sm" id="hour-seg" role="group" aria-label="小时图指标">' +
      '<button data-h="tokens" class="' + (state.hourMetric === 'tokens' ? 'on' : '') + '">Tokens</button>' +
      '<button data-h="requests" class="' + (state.hourMetric === 'requests' ? 'on' : '') + '">请求</button></div></div>' +
      '<div class="chart-wrap" id="hours-wrap"><canvas class="chart" id="hours" height="120" aria-label="24 小时分布图"></canvas></div></section>';

    html += '<section class="card" aria-label="Token 活跃"><div class="card-head"><h2>12 个月活跃</h2><span class="card-note" id="hm-note"></span><span class="grow"></span>' +
      '<div class="seg sm" id="hm-seg" role="group" aria-label="热力图模式">' +
      '<button data-h="day" class="' + (state.hmMode === 'day' ? 'on' : '') + '">每日</button>' +
      '<button data-h="week" class="' + (state.hmMode === 'week' ? 'on' : '') + '">每周</button>' +
      '<button data-h="cum" class="' + (state.hmMode === 'cum' ? 'on' : '') + '">累计</button></div></div>' +
      '<div class="heat-scroll" id="heat-scroll"><div id="heatmap"></div></div></section>';

    /* 按会话(花费 top) */
    html += '<div class="sechead"><h3>花费最高会话</h3><button class="lnk" data-goto="sessions">全部会话<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></div>';
    html += '<section class="card list"><div class="glist" id="cost-sess"></section>';

    body.innerHTML = html;
    segSyncAll(body);
    bindSegs(body);

    body.querySelectorAll('[data-goto]').forEach(function (b) {
      b.onclick = function () { setTab(this.getAttribute('data-goto')); };
    });

    if (state._series) renderTrend(state._series, k);
    renderModelCats();
    if (state._hours) drawHours('hours', state._hours, 120, 'hour-note', false);
    if (state._heat) renderHeatmap(state._heat);
    renderCostSess();
    syncNavChrome();
  }

  function renderModelCats() {
    var el = $('model-cats');
    if (!el) return;
    var k = state.kpiAll;
    var ms = k && k.models ? k.models.slice(0, 9) : [];
    if (!ms.length) { el.innerHTML = emptyHTML('暂无模型数据', ''); return; }
    var maxCost = k.totals.cost || 1;
    var html = '';
    ms.forEach(function (m, i) {
      var pct = maxCost ? (m.totals.cost || 0) / maxCost : 0;
      var sel = state.models.indexOf(m.key) >= 0;
      var c = catColor(i);
      html += '<button class="catrow' + (sel ? ' sel' : '') + '" data-model="' + esc(m.key) + '" aria-pressed="' + sel + '">' +
        '<span class="cdot" style="background:' + c + '"></span>' +
        '<span class="cmain"><span class="cname">' + esc(m.key) + '</span>' +
        '<span class="cbar"><i style="width:' + (Math.max(0, Math.min(100, pct * 100))).toFixed(1) + '%;background:' + c + '"></i></span></span>' +
        '<span class="cval"><b>¥' + fmtCost(m.totals.cost) + '</b><span>' + fmtPct(pct) + ' · ' + fmtTok((m.totals.miss || 0) + (m.totals.read || 0) + (m.totals.write || 0) + (m.totals.out || 0)) + '</span></span>' +
        '<span class="tick">' + (sel ? CHECK_SVG : '') + '</span></button>';
    });
    el.innerHTML = html;
    el.querySelectorAll('.catrow').forEach(function (b) {
      b.onclick = function () {
        var mk = b.getAttribute('data-model');
        var idx = state.models.indexOf(mk);
        if (idx >= 0) state.models.splice(idx, 1); else state.models.push(mk);
        applyUI(); loadTab('activity');
        toast(state.models.length ? '已筛选 ' + state.models.length + ' 个模型' : '已清除模型筛选');
      };
    });
  }
  var CAT_COLORS = ['--blue', '--purple', '--teal', '--orange', '--red', '--green', '--indigo', '--gray'];
  function catColor(i) {
    var fallback = ['#0a84ff', '#af52de', '#5ac8fa', '#ff9500', '#ff3b30', '#34c759', '#5856d6', '#8e8e93', '#ff2d55'];
    return cssVar(CAT_COLORS[i % CAT_COLORS.length]) || fallback[i % fallback.length];
  }

  function renderCostSess() {
    var el = $('cost-sess');
    if (!el) return;
    var list = state.costTop || [];
    if (!list.length) { el.innerHTML = emptyHTML('暂无数据', ''); return; }
    el.innerHTML = list.map(function (it) { return sessionRow(it, ' · ' + (it.totals.requests || 0) + ' 请求'); }).join('');
    el.querySelectorAll('.grow-row').forEach(function (b) {
      b.onclick = function () { openDetail(this.getAttribute('data-id')); };
    });
  }

  /* ---- 堆叠柱 / 折线(屏幕使用时间 + 股市式) ---- */
  function renderTrend(series, k) {
    var wrap = $('trend-wrap'), cv = $('trend-canvas');
    if (!wrap) return;
    if (!series || !series.length) {
      wrap.innerHTML = emptyHTML('暂无趋势数据', '当前筛选下没有记录');
      $('trend-legend').innerHTML = '';
      $('trend-hero').innerHTML = '';
      return;
    }
    if (cv.parentElement !== wrap) {
      wrap.innerHTML = '<canvas class="chart" id="trend-canvas" height="230" aria-label="用量图"></canvas>';
      cv = $('trend-canvas');
    }
    var metric = state.metric, gran = state.granularity;
    var n = series.length;
    var totAll = 0, totFirst = 0, half = Math.floor(n / 2) || 1;
    series.forEach(function (s, i) {
      var v = trendVal(s.totals, metric);
      totAll += v; if (i < half) totFirst += v;
    });
    var totSecond = totAll - totFirst;
    var deltaPct = totFirst > 0 ? ((totSecond - totFirst) / totFirst * 100) : null;
    var mLabel = metric === 'tokens' ? 'Tokens' : metric === 'cost' ? '金额' : '请求';
    $('trend-hero').innerHTML =
      '<span class="val num" id="trend-hero-v"></span>' +
      (deltaPct == null ? '' :
        '<span class="delta ' + (deltaPct >= 0 ? 'up' : 'down') + '">' + (deltaPct >= 0 ? '▲' : '▼') + ' ' + Math.abs(deltaPct).toFixed(1) + '%</span>') +
      '<span class="sub">' + mLabel + ' · 后半段 vs 前半段</span>';
    countUp($('trend-hero-v'), totAll, metric === 'cost' ? function (v) { return '¥' + fmtCost(v); } : fmtTok);

    var stacked = gran === 'day' && metric === 'tokens';
    var models = [], seen = {};
    series.forEach(function (s) {
      Object.keys(s.models || {}).forEach(function (m) { if (!seen[m]) { seen[m] = 1; models.push(m); } });
    });
    var vis = models.filter(function (m) { return !state.hidden[m]; });
    var maxV = 1;
    series.forEach(function (s) {
      var vv = stacked ? trendVal(s.totals, metric) : 0;
      if (!stacked) vis.forEach(function (m) { vv += trendVal(s.models[m], metric); });
      maxV = Math.max(maxV, vv);
    });
    maxV = maxV * 1.14 || 1;
    var pad = { l: 56, r: 8, t: 14, b: 22 };
    var o = setupCanvas(cv, 230), g = o.g;
    var xOf = function (i) { return pad.l + (n <= 1 ? (o.w - pad.l - pad.r) / 2 : (o.w - pad.l - pad.r) * i / (n - 1)); };
    var yOf = function (v) { return pad.t + (o.h - pad.t - pad.b) * (1 - v / maxV); };
    var hoverIdx = -1;
    var rgb = hexRgb(cssVar('--blue') || '#0a84ff');
    var bw = (o.w - pad.l - pad.r) / n;
    /* 柱模式悬停定位取柱中心,线模式取数据点;两套坐标不能混用 */
    var barMode = gran === 'day';
    var posOf = function (i) { return barMode ? pad.l + bw * (i + .5) : xOf(i); };
    function grid() {
      g.textAlign = 'right';
      g.font = '9.5px -apple-system, sans-serif';
      [0.5, 1].forEach(function (f) {
        var y = yOf(maxV * f);
        g.strokeStyle = cssVar('--hairline-2') || 'rgba(0,0,0,.07)';
        g.lineWidth = 1;
        g.beginPath(); g.moveTo(pad.l, y); g.lineTo(o.w - pad.r, y); g.stroke();
        g.fillStyle = cssVar('--text-3') || '#aeaeb2';
        g.fillText(metric === 'cost' ? '¥' + fmtCost(maxV * f) : fmtTok(maxV * f), pad.l - 6, y + 3);
      });
      g.textAlign = 'left';
    }
    function totAt(i) {
      if (stacked) return trendVal(series[i].totals, metric);
      var v = 0; vis.forEach(function (m) { v += trendVal(series[i].models[m], metric); });
      return v;
    }
    function topMost(parts) { var last = 0; for (var j = 0; j < parts.length; j++) if (parts[j] > 0) last = j; return last; }
    function frame() {
      g.clearRect(0, 0, o.w, o.h);
      grid();
      if (hoverIdx >= 0) {
        /* 十字线画在内容层下面 */
        g.strokeStyle = 'rgba(128,128,128,.35)';
        g.lineWidth = 1;
        g.beginPath(); g.moveTo(posOf(hoverIdx), pad.t); g.lineTo(posOf(hoverIdx), o.h - pad.b); g.stroke();
      }
      if (stacked) {
        var avg = 0, peak = 0;
        for (var i0 = 0; i0 < n; i0++) { avg += totAt(i0); if (totAt(i0) > totAt(peak)) peak = i0; }
        avg = avg / n;
        for (var i = 0; i < n; i++) {
          var t = series[i].totals || {};
          var parts = CATS.map(function (c) { return t[c.key] || 0; });
          var tot = parts[0] + parts[1] + parts[2] + parts[3];
          if (tot <= 0) continue;
          var y = o.h - pad.b;
          var topIdx = topMost(parts);
          for (var j = 0; j < parts.length; j++) {
            var c = CATS[j];
            var hSeg = (o.h - pad.t - pad.b) * parts[j] / maxV;
            if (hSeg <= 0) continue;
            var isSel = !state.stkSel || c.key === state.stkSel;
            g.fillStyle = cssVar(c.css) || '#8e8e93';
            g.globalAlpha = (i === hoverIdx ? 1 : i === n - 1 ? .92 : .78) * (isSel ? 1 : .15);
            var x0 = pad.l + bw * i + Math.max(1, bw * .14);
            var w2 = Math.max(1.5, bw * .72);
            g.beginPath();
            if (j === topIdx) rr(g, x0, y - hSeg, w2, hSeg, [2.5, 2.5, 0, 0]);
            else rr(g, x0, y - hSeg, w2, hSeg + .5, 0);
            g.fill();
            y -= hSeg;
          }
          g.globalAlpha = 1;
        }
        if (avg > 0 && n > 1) {
          var ya = yOf(avg);
          g.strokeStyle = cssVar('--text-3') || '#aeaeb2';
          g.lineWidth = 1;
          g.setLineDash([4, 4]);
          g.beginPath(); g.moveTo(pad.l, ya); g.lineTo(o.w - pad.r, ya); g.stroke();
          g.setLineDash([]);
          g.fillStyle = cssVar('--text-3') || '#aeaeb2';
          g.font = '9.5px -apple-system, sans-serif';
          g.textAlign = 'right';
          g.fillText('均值 ' + fmtTok(avg), o.w - pad.r - 2, ya - 4);
          g.textAlign = 'left';
        }
      } else if (gran === 'day') {
        var peak2 = 0;
        for (var i2 = 1; i2 < n; i2++) if (totAt(i2) > totAt(peak2)) peak2 = i2;
        for (var i3 = 0; i3 < n; i3++) {
          var v = totAt(i3);
          var h2 = (o.h - pad.t - pad.b) * v / maxV;
          var x3 = pad.l + bw * i3 + Math.max(1, bw * .14);
          var w3 = Math.max(1.5, bw * .72);
          g.fillStyle = i3 === n - 1 ? 'rgba(' + rgb.join(',') + ',1)'
            : i3 === peak2 ? 'rgba(' + rgb.join(',') + ',.85)'
              : i3 === hoverIdx ? 'rgba(' + rgb.join(',') + ',.75)' : 'rgba(' + rgb.join(',') + ',.34)';
          g.beginPath();
          rr(g, x3, o.h - pad.b - h2, w3, Math.max(h2, 2), Math.min(3, w3 / 2));
          g.fill();
        }
      } else {
        vis.forEach(function (m, mi) {
          g.strokeStyle = catColor(mi);
          g.globalAlpha = .55;
          g.lineWidth = 1.4;
          g.lineJoin = 'round'; g.lineCap = 'round';
          g.beginPath();
          var started = false;
          for (var j = 0; j < n; j++) {
            var x = xOf(j), y = yOf(trendVal(series[j].models[m], metric));
            if (!started) { g.moveTo(x, y); started = true; } else g.lineTo(x, y);
          }
          g.stroke();
          g.globalAlpha = 1;
        });
        var grad = g.createLinearGradient(0, pad.t, 0, o.h - pad.b);
        grad.addColorStop(0, 'rgba(' + rgb.join(',') + ',.20)');
        grad.addColorStop(1, 'rgba(' + rgb.join(',') + ',.02)');
        g.beginPath();
        for (var j2 = 0; j2 < n; j2++) {
          var x2 = xOf(j2), y2 = yOf(totAt(j2));
          if (j2 === 0) g.moveTo(x2, y2); else g.lineTo(x2, y2);
        }
        g.lineTo(xOf(n - 1), o.h - pad.b); g.lineTo(xOf(0), o.h - pad.b); g.closePath();
        g.fillStyle = grad; g.fill();
        g.beginPath();
        for (j2 = 0; j2 < n; j2++) {
          var x3b = xOf(j2), y3b = yOf(totAt(j2));
          if (j2 === 0) g.moveTo(x3b, y3b); else g.lineTo(x3b, y3b);
        }
        g.strokeStyle = 'rgba(' + rgb.join(',') + ',1)';
        g.lineWidth = 2.4;
        g.stroke();
      }
      g.fillStyle = cssVar('--text-3') || '#aeaeb2';
      g.font = '9.5px -apple-system, sans-serif';
      g.textAlign = 'center';
      var step = Math.max(1, Math.ceil(n / 7));
      for (var i4 = 0; i4 < n; i4 += step) g.fillText(trendLabel(series[i4].key, gran), xOf(i4), o.h - 6);
      g.textAlign = 'left';
      if (hoverIdx >= 0) {
        g.fillStyle = 'rgba(' + rgb.join(',') + ',1)';
        g.beginPath(); g.arc(posOf(hoverIdx), yOf(totAt(hoverIdx)), 3.4, 0, Math.PI * 2); g.fill();
      }
    }
    frame();
    var lh = '';
    if (stacked) {
      CATS.forEach(function (c) {
        var on = !state.stkSel || state.stkSel === c.key;
        lh += '<button class="lg' + (on ? ' on' : ' off') + '" data-cat="' + c.key + '" aria-pressed="' + on + '"><i style="background:' + (cssVar(c.css) || '#8e8e93') + '"></i>' + c.label + '</button>';
      });
    } else {
      models.forEach(function (m, i) {
        lh += '<button class="lg' + (state.hidden[m] ? ' off' : ' on') + '" data-m="' + esc(m) + '" aria-pressed="' + (!state.hidden[m]) + '"><i style="background:' + catColor(i) + '"></i>' + esc(m) + '</button>';
      });
    }
    $('trend-legend').innerHTML = lh;
    $('trend-legend').querySelectorAll('.lg').forEach(function (b) {
      b.onclick = function () {
        if (stacked) {
          var c = this.getAttribute('data-cat');
          state.stkSel = (state.stkSel === c) ? null : c;
        } else {
          var m = this.getAttribute('data-m');
          state.hidden[m] = !state.hidden[m];
        }
        renderTrend(state._series, state.kpiAct);
      };
    });
    cv.onmousemove = function (e) {
      var rect = cv.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var idx;
      if (barMode) {
        idx = Math.floor((x - pad.l) / bw);
        if (x < pad.l - 2 || idx < 0 || idx > n - 1) { if (hoverIdx >= 0) { hoverIdx = -1; frame(); hideTip(); } return; }
      } else {
        idx = n <= 1 ? 0 : Math.round((x - pad.l) / ((o.w - pad.l - pad.r) / Math.max(1, n - 1)));
        if (x < pad.l - 4 || idx < 0 || idx > n - 1) { if (hoverIdx >= 0) { hoverIdx = -1; frame(); hideTip(); } return; }
      }
      if (idx !== hoverIdx) { hoverIdx = idx; frame(); }
      var s = series[idx];
      var html = '<b>' + esc(trendLabel(s.key, gran)) + ' · ' + esc(mLabel) + '</b>';
      if (stacked) {
        var t = s.totals || {};
        CATS.forEach(function (c) { html += '<div class="row"><span>' + c.label + '</span><span>' + fmtTok(t[c.key]) + '</span></div>'; });
        html += '<div class="row" style="margin-top:3px;border-top:1px solid rgba(255,255,255,.15);padding-top:3px"><span>合计</span><span>' + fmtTok(totAt(idx)) + '</span></div>';
      } else {
        var rows = vis.map(function (m) { return { m: m, v: trendVal(s.models[m], metric) }; }).sort(function (a, b) { return b.v - a.v; });
        rows.slice(0, 8).forEach(function (r) {
          html += '<div class="row"><span>' + esc(r.m) + '</span><span>' + (metric === 'cost' ? '¥' + fmtCost(r.v) : fmtTok(r.v)) + '</span></div>';
        });
        if (rows.length > 8) html += '<div class="row"><span>…共 ' + rows.length + ' 个模型</span></div>';
        html += '<div class="row" style="margin-top:3px;border-top:1px solid rgba(255,255,255,.15);padding-top:3px"><span>合计</span><span>' + (metric === 'cost' ? '¥' + fmtCost(totAt(idx)) : fmtTok(totAt(idx))) + '</span></div>';
      }
      showTip(e.clientX, e.clientY, html);
    };
    cv.onmouseleave = function () { hoverIdx = -1; frame(); hideTip(); };
  }

  /* ---- 24 小时柱(今天页 / 活动页共用) ---- */
  function drawHours(canvasId, buckets, cssH, noteId, todayMode) {
    var cv = $(canvasId);
    if (!cv) return;
    var wrap = cv.parentElement;
    if (!buckets || !buckets.length) { wrap.innerHTML = emptyHTML('暂无数据', ''); if (noteId && $(noteId)) $(noteId).textContent = ''; return; }
    if (cv.parentElement !== wrap) { /* recreated */ }
    var metric = todayMode ? 'tokens' : state.hourMetric;
    var vals = buckets.map(function (b) {
      return metric === 'tokens' ? ((b.totals.miss || 0) + (b.totals.read || 0) + (b.totals.write || 0) + (b.totals.out || 0)) : (b.totals.requests || 0);
    });
    var maxV = Math.max.apply(null, vals.concat([1])) * 1.1;
    var peak = 0;
    for (var i = 1; i < 24; i++) if (vals[i] > vals[peak]) peak = i;
    var pad = { l: 8, r: 8, t: 8, b: 16 };
    var o = setupCanvas(cv, cssH), g = o.g;
    var bw = (o.w - pad.l - pad.r) / 24;
    var hoverIdx = -1;
    var rgb = hexRgb(cssVar('--blue') || '#0a84ff');
    function frame() {
      g.clearRect(0, 0, o.w, o.h);
      for (var i = 0; i < 24; i++) {
        var h2 = (o.h - pad.t - pad.b) * vals[i] / maxV;
        g.fillStyle = i === peak ? 'rgba(' + rgb.join(',') + ',.95)'
          : i === hoverIdx ? 'rgba(' + rgb.join(',') + ',.8)' : 'rgba(' + rgb.join(',') + ',.30)';
        var x0 = pad.l + bw * i + 1.5;
        var y0 = o.h - pad.b - h2;
        var w2 = Math.max(1, bw - 3);
        if (h2 > 0.5) { g.beginPath(); rr(g, x0, y0, w2, h2, Math.min(3, w2 / 2)); g.fill(); }
        else { g.beginPath(); g.arc(x0 + w2 / 2, o.h - pad.b - 1.5, 1.5, 0, Math.PI * 2); g.fill(); }
      }
      g.fillStyle = cssVar('--text-3') || '#aeaeb2';
      g.font = '9.5px -apple-system, sans-serif';
      g.textAlign = 'center';
      for (i = 0; i < 24; i += 3) g.fillText(i + ' 时', pad.l + bw * i + bw / 2, o.h - 4);
      g.textAlign = 'left';
    }
    frame();
    var totalAll = vals.reduce(function (a, b) { return a + b; }, 0) || 1;
    if (noteId && $(noteId)) $(noteId).textContent = '峰值 ' + pad2(peak) + ':00 · ' + fmtTok(vals[peak]) + (metric === 'tokens' ? ' tokens' : ' 次请求');
    cv.onmousemove = function (e) {
      var rect = cv.getBoundingClientRect();
      var idx = Math.floor((e.clientX - rect.left - pad.l) / bw);
      if (idx < 0 || idx > 23) { if (hoverIdx >= 0) { hoverIdx = -1; frame(); hideTip(); } return; }
      if (idx !== hoverIdx) { hoverIdx = idx; frame(); }
      var b = buckets[idx], t = b.totals || {};
      var share = (vals[idx] / totalAll * 100).toFixed(1);
      showTip(e.clientX, e.clientY,
        '<b>' + pad2(idx) + ':00 – ' + pad2((idx + 1) % 24) + ':00 · 占全天 ' + share + '%</b>' +
        '<div class="row"><span>未命中</span><span>' + fmtTok(t.miss) + '</span></div>' +
        '<div class="row"><span>缓存命中</span><span>' + fmtTok(t.read) + '</span></div>' +
        '<div class="row"><span>缓存写入</span><span>' + fmtTok(t.write) + '</span></div>' +
        '<div class="row"><span>输出</span><span>' + fmtTok(t.out) + '</span></div>' +
        '<div class="row"><span>请求</span><span>' + (t.requests || 0) + '</span></div>');
    };
    cv.onmouseleave = function () { hoverIdx = -1; frame(); hideTip(); };
  }

  /* ---- 热力图 ---- */
  function renderHeatmap(days) {
    var box = $('heatmap');
    if (!box) return;
    if (!days || !days.length) { box.innerHTML = emptyHTML('暂无数据', ''); $('hm-note').textContent = ''; return; }
    var mode = state.hmMode, curMode = mode;
    var byDay = {}, daysMeta = {};
    days.forEach(function (d) { byDay[d.day] = d.total || 0; daysMeta[d.day] = d; });
    var keys = Object.keys(byDay).sort();
    var rgb = hexRgb(cssVar('--blue') || '#0a84ff');
    function alphaOf(v, maxV) {
      if (v <= 0 || !maxV) return 0;
      return Math.max(.1, Math.min(1, .08 + .92 * Math.pow(v / maxV, .75)));
    }
    function cellOf(tip, v, maxV, key) {
      var a = alphaOf(v, maxV);
      return '<div class="hm-cell" role="button" tabindex="0" data-key="' + esc(key) + '" data-tip="' + esc(tip) + '" aria-label="' + esc(tip) + '" style="background:' + (a ? 'rgba(' + rgb.join(',') + ',' + a.toFixed(2) + ')' : 'var(--chip)') + '"></div>';
    }
    var html = '';
    if (mode === 'week') {
      var base = new Date(keys[0] + 'T00:00:00');
      base.setDate(base.getDate() - (base.getDay() + 6) % 7);
      var endD = new Date(keys[keys.length - 1] + 'T00:00:00');
      var wks = [], wkVals = [];
      for (var d = new Date(base.getTime()); d.getTime() <= endD.getTime() + 6 * 86400000 && wks.length < 62; d.setDate(d.getDate() + 7)) {
        var wk = dayKey(d.getTime()), v = 0;
        for (var i = 0; i < 7; i++) { var k = dayKey(d.getTime() + i * 86400000); if (byDay[k]) v += byDay[k]; }
        wks.push(wk); wkVals.push(v);
      }
      var maxW = Math.max.apply(null, wkVals.concat([1]));
      html = '<div class="hm-grid" style="grid-template-columns:30px repeat(' + wks.length + ',1fr);grid-auto-rows:16px"><div class="hm-lbl"></div>';
      wks.forEach(function (wk, i) { html += '<div class="hm-lbl" style="text-align:center">' + (i % 4 === 0 ? esc(shortKey(wk)) : '') + '</div>'; });
      var wdNames = ['一', '二', '三', '四', '五', '六', '日'];
      for (var r = 0; r < 7; r++) {
        html += '<div class="hm-lbl">' + wdNames[r] + '</div>';
        wks.forEach(function (wk, i) {
          var k3 = dayKey(new Date(wk + 'T00:00:00').getTime() + r * 86400000);
          var v3 = byDay[k3] || 0;
          html += cellOf('周 ' + esc(shortKey(wks[i])) + ' 起 · 该周 ' + fmtTok(wkVals[i]) + ' tokens · 该日 ' + fmtTok(v3), v3, maxW, wk);
        });
      }
      html += '</div>';
      $('hm-note').textContent = wks.length + ' 周 · 点击跳转该周';
    } else {
      var months = {};
      keys.forEach(function (k) { var mk = k.slice(0, 7); (months[mk] = months[mk] || []).push(k); });
      var monthKeys = Object.keys(months).sort();
      var totAll = keys.reduce(function (a, k) { return a + byDay[k]; }, 0);
      var maxM = mode === 'cum' ? (totAll || 1) : Math.max.apply(null, keys.map(function (k) { return byDay[k]; }).concat([1]));
      var cum = 0;
      html = '<div class="hm-grid" style="grid-template-columns:46px repeat(31,1fr);grid-auto-rows:18px"><div class="hm-lbl"></div>';
      for (var dd = 1; dd <= 31; dd++) html += '<div class="hm-lbl" style="text-align:center">' + (dd % 5 === 0 || dd === 1 ? dd : '') + '</div>';
      monthKeys.forEach(function (mk) {
        var dim = new Date(Number(mk.slice(0, 4)), Number(mk.slice(5, 7)), 0).getDate();
        html += '<div class="hm-lbl">' + esc(shortKey(mk + '-01')) + '</div>';
        for (var d2 = 1; d2 <= 31; d2++) {
          if (d2 > dim) { html += '<div class="hm-none"></div>'; continue; }
          var kk = mk + '-' + pad2(d2);
          var v2 = byDay[kk] || 0;
          var meta = daysMeta[kk];
          var tip = kk + ' · ' + fmtTok(v2) + ' tokens' + (meta ? ' · ' + (meta.requests || 0) + ' 请求' : '');
          var disp = mode === 'cum' ? (cum += v2) : v2;
          html += cellOf(tip, disp, maxM, kk);
        }
      });
      html += '</div>';
      $('hm-note').textContent = '12 个月 · 点击某天跳转到该日';
    }
    box.innerHTML = html;
    box.querySelectorAll('.hm-cell[data-key]').forEach(function (c) {
      var tipText = c.getAttribute('data-tip');
      c.addEventListener('mouseenter', function (e) { showTip(e.clientX, e.clientY, '<b>' + esc(tipText) + '</b>'); });
      c.addEventListener('mouseleave', hideTip);
      c.addEventListener('click', function () {
        var k = c.getAttribute('data-key');
        if (curMode === 'week') {
          var to = dayKey(new Date(k + 'T00:00:00').getTime() + 6 * 86400000);
          state.range = 'custom'; state.from = k; state.to = to;
        } else {
          state.range = 'custom'; state.from = k; state.to = k;
        }
        setTab('activity'); applyUI(); loadTab('activity');
        toast(state.from + ' ~ ' + state.to);
      });
      c.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); c.click(); } });
    });
  }

  /* ================= TAB · 会话 ================= */
  function renderSessions() {
    var body = $('sessions-body');
    var all = state.sessionsList || [];
    var q = state.search.trim().toLowerCase();
    /* 搜索在服务端完成(q= 标题/工作目录/工作区/会话 ID,覆盖全部会话),
       不再受前端 100 条快照限制;本地不再二次过滤 */
    var items = all;
    if (!items.length) {
      body.innerHTML = emptyHTML(q ? '没有匹配"' + state.search + '"的会话' : '当前筛选下没有会话', q ? '换个关键词试试' : '尝试放宽时间或模型筛选');
      return;
    }
    var html = '';
    items.forEach(function (it) { html += sessionRow(it); });
    body.innerHTML = html;
    body.querySelectorAll('.grow-row').forEach(function (b) {
      b.onclick = function () { openDetail(this.getAttribute('data-id')); };
    });
  }

  /* ================= TAB · 设置 ================= */
  function renderSettings() {
    var body = $('settings-body');
    var meta = state.meta || {}, cfg = state.config || {};
    var budget = cfg.budget && cfg.budget.monthly;
    var html = '';

    /* 外观 */
    html += '<div class="gtitle">外观</div><section class="card group">' +
      '<div class="setrow"><span class="sl">主题</span>' +
      '<div class="seg sm seg-inline" id="theme-seg" role="group" aria-label="主题">' +
      '<button data-t="auto" class="' + (state.theme === 'auto' ? 'on' : '') + '">自动</button>' +
      '<button data-t="light" class="' + (state.theme === 'light' ? 'on' : '') + '">浅色</button>' +
      '<button data-t="dark" class="' + (state.theme === 'dark' ? 'on' : '') + '">深色</button></div></div>' +
      '<div class="setrow"><span class="sl">数据来源</span><span class="sv">仅本机 · 零上传</span></div></section>';

    /* 预算 */
    html += '<div class="gtitle">月度预算</div><section class="card group">';
    if (budget) {
      var kM = state.kpiMonth;
      var used = kM ? kM.totals.cost : 0;
      var pct = Math.min(1, used / budget);
      var d = new Date();
      var dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      var projected = used / Math.max(1, d.getDate()) * dim;
      var over = projected > budget;
      var barColor = pct >= 1 ? 'var(--red)' : pct >= .8 ? 'var(--orange)' : 'var(--green)';
      html += '<div class="setrow"><span class="sl">预算</span><span class="sv">¥' + fmtCost(budget) + ' / 月</span></div>' +
        '<div class="setrow stack"><span class="sl">本月已花</span><span class="sv" style="color:var(--text)">¥' + fmtCost(used) + ' · ' + fmtPct(used / budget) + '</span>' +
        '<div class="budget-bar" style="flex-basis:100%"><i style="width:' + (pct * 100).toFixed(1) + '%;background:' + barColor + '"></i></div></div>' +
        '<div class="setrow"><span class="sl">外推月底</span><span class="sv">' + (over ? '<span style="color:var(--red);font-weight:600">超 ¥' + fmtCost(projected - budget) + '</span>' : '剩 ¥' + fmtCost(budget - projected)) + '</span></div>' +
        '<div class="setrow"><span class="sl">日均</span><span class="sv">¥' + fmtCost(used / Math.max(1, d.getDate())) + ' · 已过 ' + d.getDate() + '/' + dim + ' 天</span></div>';
    }
    html += '<div class="setrow" id="budget-edit-row" style="display:none"><span class="sl">月度预算 ¥</span>' +
      '<input class="inp" id="budget-input" type="number" min="0" step="10" style="width:96px;margin-left:auto;text-align:right" value="' + (budget || '') + '" placeholder="如 200">' +
      '<button class="btn sm primary" id="b-budget-save">保存</button>' +
      (budget ? '<button class="btn sm ghost" id="b-budget-clear">清除</button>' : '') + '</div>' +
      '<div class="setrow"><span class="sl grow"></span><button class="barrowbtn" id="b-budget-edit">' + (budget ? '调整' : '设置预算') +
      '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button></div></section>';

    /* 模型单价 */
    // 这是**配置面**,所以只列「当前仍配置在 DSH 里」∪「已自定义单价」的模型。
    // 原因:模型清单本身来自历史用量,只增不减 —— 你在 DSH 里删掉配置后历史账单还在,
    // 列表不会缩;而"最近 N 天用过"也区分不出已删配置(删除往往紧跟在近期使用之后)。
    // 已自定义单价的模型必须保留 —— 否则它的历史成本会掉回家族默认价,那才是丢归因。
    // 历史用量/导出/会话下钻一概不受影响,这里过滤的只是"谁占配置表位"。
    var prices = cfg.prices || {};
    // 官方默认价(含高峰/空闲两档):缺失 = 该模型没有内置价,成本按 ¥0 计。
    // hasDefaults 区分两种"查不到":host 未升级(整个字段缺席)vs 该模型确实无内置价 ——
    // 页面按 mtime 热更新、host 需重启,两者可能短暂不同步,此时必须退回旧标签而不是误报"未定价"。
    var hasDefaults = !!(cfg.defaults && typeof cfg.defaults === 'object');
    var defaults = hasDefaults ? cfg.defaults : {};
    var allModels = meta.models || [];
    // configuredModels 为 null/空 = host 读不到 DSH 配置 → **关闭过滤**退回显示全部
    var configured = meta.configuredModels;
    var filterOn = !!(configured && ((configured.exact || []).length + (configured.byId || []).length));
    var exactSet = {}, byIdSet = {};
    if (configured) {
      (configured.exact || []).forEach(function (k) { exactSet[k] = 1; });
      (configured.byId || []).forEach(function (k) { byIdSet[k] = 1; });
    }
    var isConfigured = function (mk) {
      if (!filterOn) return true;
      if (exactSet[mk]) return true;
      var i = mk.indexOf(':');
      return !!byIdSet[i >= 0 ? mk.slice(i + 1) : mk];
    };
    var inUseModels = allModels.filter(function (mk) { return isConfigured(mk) || prices[mk]; });
    var models = (state.modelsAll || !filterOn) ? allModels : inUseModels;
    var hiddenN = allModels.length - inUseModels.length;
    var showToggle = filterOn && (hiddenN > 0 || state.modelsAll);

    html += '<div class="gtitle">模型单价 · ¥ / 1M tokens</div><section class="card group">';
    // 提示写在功能界面最上面
    html += '<div class="sl" style="font-size:12px;color:var(--text-2);line-height:1.6;padding:2px 0 8px">' +
      '单价按<b>时段</b>浮动:高峰与空闲分别计价。留空即用该模型的内置价;<b>高峰时段/高峰日只是当前官方策略,可自行修改</b>,改动会立刻重算全部历史成本。</div>';
    // 时段规则(可配置,不写死)。defaultsSchedule 是"host 支持本特性"的可靠标志:
    // 页面热更新、host 需重启,中间态可能只有 defaults/schedule 而没有它 —— 此时
    // 若渲染控件,「官方默认」预设会读到 undefined 而变成清空,是破坏性误操作。
    var hasSchedule = hasDefaults && !!(cfg.defaultsSchedule && Array.isArray(cfg.defaultsSchedule.hours));
    if (hasSchedule) {
      var DAY_ORDER = [1, 2, 3, 4, 5, 6, 0], DAY_LABEL = { 0: '日', 1: '一', 2: '二', 3: '三', 4: '四', 5: '五', 6: '六' };
      var selH = {}, selD = {};
      (cfg.schedule.hours || []).forEach(function (r) { for (var i = r[0]; i < r[1]; i++) selH[i] = 1; });
      (cfg.schedule.days || []).forEach(function (d) { selD[d] = 1; });
      var daysHTML = DAY_ORDER.map(function (d) {
        return '<button data-d="' + d + '" class="' + (selD[d] ? 'on' : '') + '" aria-pressed="' + (selD[d] ? 'true' : 'false') + '" aria-label="周' + DAY_LABEL[d] + '">' + DAY_LABEL[d] + '</button>';
      }).join('');
      var hoursHTML = '';
      for (var h = 0; h < 24; h++) {
        hoursHTML += '<button data-h="' + h + '" class="' + (selH[h] ? 'on' : '') + '" aria-pressed="' + (selH[h] ? 'true' : 'false') + '" aria-label="' + pad2(h) + ':00 高峰">' + h + '</button>';
      }
      html += '<div class="setrow stack"><span class="sl">高峰日</span>' +
        '<div class="fill daychips" id="peak-days" role="group" aria-label="高峰日">' + daysHTML + '</div></div>' +
        '<div class="setrow stack"><span class="sl">高峰时段<em>北京时间,按小时点选</em></span>' +
        '<div class="fill hrgrid" id="peak-hours" role="group" aria-label="高峰时段">' + hoursHTML + '</div>' +
        // 摘要直接渲染出来(而不是等 JS 回填),避免首帧空白
        '<div class="fill peak-sum" id="peak-summary">' + peakSummaryText(selH, selD) + '</div></div>' +
        '<div class="setrow"><span class="sl">快捷</span>' +
        '<div class="peak-presets">' +
        '<button id="peak-preset-official">官方默认</button>' +
        '<button id="peak-preset-all">全天</button>' +
        '<button id="peak-preset-none">清空</button></div></div>';
    }
    if (!models.length) html += emptyHTML('没有需要配置单价的模型', allModels.length ? '当前配置里的模型都还没有用量记录' : '');
    else {
      models.forEach(function (mk) {
        var e = prices[mk] || null, d = defaults[mk] || null;
        var pk = (e && e.peak) || {}, idl = (e && e.idle) || {};
        var ph = function (t, f) { return d ? String(d[t][f]) : ''; };
        var pill = e ? '<span class="pill">自定义</span>'
          : (!hasDefaults || d) ? '<span class="pill" style="opacity:.6">官方价</span>'
          : '<span class="pill" style="opacity:.6">未定价 · 按 ¥0 计</span>';
        var tierRow = function (t, name, vals) {
          return '<div class="pgrid"><span class="ptag">' + name + '</span>' +
            pcell(mk, t, 'miss', '未命中', vals.miss, ph(t, 'miss')) + pcell(mk, t, 'hit', '命中', vals.hit, ph(t, 'hit')) +
            pcell(mk, t, 'write', '写入', vals.write, ph(t, 'write')) + pcell(mk, t, 'output', '输出', vals.output, ph(t, 'output')) +
            '</div>';
        };
        html += '<div class="prow"><div class="phead"><span class="pmodel mono">' + esc(mk) + '</span>' + pill + '</div>' +
          tierRow('peak', '高峰', pk) + tierRow('idle', '空闲', idl) + '</div>';
      });
    }
    var priceNote = !allModels.length ? ''
      : !filterOn ? '读不到 DSH 模型配置,已显示全部 ' + allModels.length + ' 个'
      : state.modelsAll ? '显示全部 ' + allModels.length + ' 个模型'
      : hiddenN > 0 ? '已隐藏 ' + hiddenN + ' 个已不再配置的模型'
      : '全部 ' + allModels.length + ' 个模型都还在配置里';
    html += '<div class="setrow">' +
      '<span class="sl" style="flex:1;min-width:0;font-size:12px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(priceNote) + '</span>' +
      (showToggle ? '<button class="barrowbtn" id="b-models-all">' + (state.modelsAll ? '只看配置中的' : '显示全部 (' + allModels.length + ')') + '</button>' : '') +
      '<button class="barrowbtn" id="b-price-reset">恢复官方价</button></div></section>';

    /* 数据 */
    html += '<div class="gtitle">数据</div><section class="card group">' +
      '<div class="setrow"><span class="sl">增量扫描会话日志</span><button class="btn sm primary" id="b-scan" style="margin-left:auto">扫描</button></div>' +
      '<div class="setrow"><span class="sl">导出日 × 模型明细</span><button class="btn sm ghost" id="b-export-csv" style="margin-left:auto">CSV</button></div>' +
      '<div class="setrow"><span class="sl">导出逐请求明细</span><button class="btn sm ghost" id="b-export-json" style="margin-left:auto">JSON</button></div></section>';

    /* 关于 */
    var s = meta.stats || {}, ls = s.lastSummary || {};
    html += '<div class="gtitle">关于</div><section class="card group">' +
      '<div class="setrow stack"><span class="sl">数据源</span><span class="sv mono">' + esc(meta.sessionsRoot || '—') + '</span></div>' +
      '<div class="setrow stack"><span class="sl">聚合缓存</span><span class="sv mono">' + esc(meta.storeFile || '—') + '</span></div>' +
      '<div class="setrow"><span class="sl">会话 / 请求</span><span class="sv">' + esc(meta.sessionCount) + ' / ' + esc(meta.requestCount) + '</span></div>' +
      '<div class="setrow"><span class="sl">覆盖范围</span><span class="sv">' + esc(meta.dayCount) + ' 天 · ' + esc(meta.monthCount) + ' 个月</span></div>' +
      '<div class="setrow"><span class="sl">最近扫描</span><span class="sv">' + (s.lastScanAt ? fmtDate(s.lastScanAt) + ' · ' : '') + (ls.durationMs || 0) + ' ms · 变更 ' + (ls.changed || 0) + '/' + (ls.totalSessions || 0) + '</span></div>' +
      '<div class="setrow"><span class="sl">扫描累计</span><span class="sv">全量 ' + (s.fullScans || 0) + ' · 增量 ' + (s.incrementalScans || 0) + ' · 失败 ' + (s.failedSessions || 0) + '</span></div>' +
      '<div class="setrow stack"><span class="sl">模型(' + (models.length === allModels.length ? models.length : models.length + ' / ' + allModels.length) + ')</span><span class="sv" style="font-size:11px">' + models.map(esc).join(' · ') + '</span></div>' +
      '<div class="setrow"><span class="sl">版本</span><span class="sv">' + (meta.version ? 'v' + esc(meta.version) : '—') + '</span></div></section>';

    body.innerHTML = html;
    segSyncAll(body);

    body.querySelectorAll('#theme-seg button').forEach(function (b) {
      b.onclick = function (e) {
        state.theme = b.getAttribute('data-t');
        localStorage.setItem('dsh-token-theme', state.theme === 'auto' ? '' : state.theme);
        applyTheme(true, e.clientX, e.clientY);
        var seg = $('theme-seg');
        seg.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
        segSync(seg);
        toast(themeToastText());
      };
    });
    var editRow = $('budget-edit-row');
    $('b-budget-edit').onclick = function () {
      editRow.style.display = editRow.style.display === 'none' ? 'flex' : 'none';
      segSyncAll(body);
    };
    $('b-budget-save').onclick = function () {
      var v = Number($('budget-input').value);
      if (!(v > 0)) { toast('请输入大于 0 的预算金额'); return; }
      post('/config', { budget: { monthly: v } }).then(function () { toast('预算已保存 ¥' + v); loadTab('settings'); loadTab(state.tab, true); }).catch(function (e) { toast('保存失败: ' + e.message); });
    };
    var clearBtn = $('b-budget-clear');
    if (clearBtn) clearBtn.onclick = function () {
      post('/config', { budget: { monthly: 0 } }).then(function () { toast('已取消月度预算'); loadTab('settings'); }).catch(function (e) { toast('保存失败: ' + e.message); });
    };
    var priceTimer = null;
    body.querySelectorAll('.prow input').forEach(function (inp) {
      inp.onchange = function () {
        if (priceTimer) clearTimeout(priceTimer);
        priceTimer = setTimeout(function () {
          var prev = (state.config || {}).prices || {};
          var next = JSON.parse(JSON.stringify(prev));
          // 只重建"当前渲染出来"的模型,被筛选隐藏的覆盖必须原样保留
          var rendered = {};
          body.querySelectorAll('.prow input').forEach(function (i2) { rendered[i2.getAttribute('data-m')] = 1; });
          Object.keys(rendered).forEach(function (m) { delete next[m]; });
          body.querySelectorAll('.prow input').forEach(function (i2) {
            var v = i2.value.trim();
            if (v === '') return;
            var n = Number(v);
            if (!isFinite(n) || n < 0) return;
            var m = i2.getAttribute('data-m'), t = i2.getAttribute('data-t'), f = i2.getAttribute('data-f');
            var e = next[m] || (next[m] = { peak: {}, idle: {} });
            e[t][f] = n;
          });
          Object.keys(rendered).forEach(function (m) {
            var e = next[m];
            if (!e) { if (prev[m]) next[m] = null; return } // 清空 = 删除覆盖,回到官方价
            // 只填了一档 → 另一档跟随(不分时段的常见用法)
            if (!Object.keys(e.peak).length) e.peak = e.idle;
            if (!Object.keys(e.idle).length) e.idle = e.peak;
            if (!Object.keys(e.peak).length) delete next[m];
          });
          post('/config', { prices: next }).then(function () {
            toast('单价已保存');
            get('/config').then(function (c) { state.config = c; });
          }).catch(function (e) { toast('保存单价失败: ' + e.message); });
        }, 400);

  function drawCurve(reqs) {

  function drawStack(reqs) {
